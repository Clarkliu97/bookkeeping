name: Validation and Playwright E2E

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install backend dependencies
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Run backend lint
        working-directory: api
        run: python -m ruff check .

      - name: Run backend tests
        working-directory: api
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend lint
        working-directory: web
        run: npm run lint

      - name: Run frontend type checking
        working-directory: web
        run: npm run typecheck

      - name: Build frontend
        working-directory: web
        run: npm run build

  operator-workspace-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Run operator workspace browser suite in Docker Compose
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e e2e

      - name: Upload Playwright report
        if: always() && hashFiles('web/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report

      - name: Tear down compose stack
        if: always()
        run: docker compose --profile test down -v

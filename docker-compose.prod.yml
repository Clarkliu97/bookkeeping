services:
  api:
    build:
      target: production
    command:
      [
        "sh",
        "-lc",
        "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]
    environment:
      API_ENV: production
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS_PROD:-http://127.0.0.1:3000,http://localhost:3000}
    ports: !override
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes: !override
      - ./storage:/app/storage

  web:
    build:
      target: production
    environment:
      NODE_ENV: production
      NEXT_ALLOWED_DEV_ORIGINS: ""
    ports: !override
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes: !override []
    command: ["npm", "run", "start", "--", "--hostname", "0.0.0.0", "--port", "3000"]